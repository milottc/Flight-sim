<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://s3.amazonaws.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="apple-touch-icon" href="/Flight-sim/compressed/180.png">
  <link rel="manifest" href="/Flight-sim/compressed/manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <!-- Standard Browser Favicon (Chrome, Edge, Firefox) -->
<link rel="icon" type="image/png" href="192.png">

<!-- Apple Touch Icon (iPhones & iPads) -->
<link rel="apple-touch-icon" href="180.png">

<!-- Microsoft Windows Tile (Optional, makes it look good when pinned to Start) -->
<meta name="msapplication-TileImage" content="144.png">
<title>Babylon Flight 737 · Pro</title>
<style>
/* ============================================================ */
/* BABYLON FLIGHT 737 · SOLID GAME UI                           */
/* ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1220;color:#e6edf6;font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:500;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#renderCanvas{width:100%;height:100%;display:block;outline:none;touch-action:none}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0a0f1c;border-radius:6px}
::-webkit-scrollbar-thumb{background:#2a3a55;border-radius:6px;border:2px solid #0a0f1c}
::-webkit-scrollbar-thumb:hover{background:#3d5170}

/* ============ TOP BADGES ============ */
#errorBanner{position:fixed;top:0;left:0;right:0;z-index:99999;display:none;background:#b91c1c;color:#fff;padding:12px 20px;font-size:13px;white-space:pre-wrap;border-bottom:2px solid #000;font-weight:600;letter-spacing:.3px}
#bootBadge{position:fixed;top:10px;right:14px;z-index:9999;padding:7px 14px;border-radius:10px;background:rgba(14,21,38,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(34,211,238,.45);color:#a5f3fc;font-size:11px;font-weight:600;letter-spacing:1.5px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#camBadge{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9999;padding:9px 20px;border-radius:10px;background:rgba(14,21,38,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(34,211,238,.45);color:#a5f3fc;font-size:12px;font-weight:700;letter-spacing:2.5px;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s}
body.cockpit #camBadge{opacity:0}

/* ============ HUD ============ */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.panelBox{
  position:absolute;
  background:rgba(14,21,38,.72);
  backdrop-filter:blur(10px) saturate(1.3);
  -webkit-backdrop-filter:blur(10px) saturate(1.3);
  border:1px solid rgba(100,130,170,.35);
  border-radius:14px;
  padding:10px 14px;
  box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);
}

#infoBox{left:20px;top:20px;width:250px;font-size:11.5px;line-height:1.7;border-color:#22d3ee}
#infoBox .lbl{font-weight:700;letter-spacing:1.5px;color:#22d3ee;font-size:11px;margin-bottom:5px;text-transform:uppercase}
#infoBox .sub{color:#8ba3c0;font-size:11px}

#msgBox{
  left:50%;top:66px;transform:translateX(-50%);
  font-size:13px;letter-spacing:.8px;
  color:#0b1220;
  opacity:0;
  transition:opacity .3s;
  text-align:center;
  max-width:80vw;
  padding:10px 22px;
  border-radius:10px;
  background:#fbbf24;
  border:2px solid #000;
  box-shadow:0 3px 0 #000;
  font-weight:700;
}

/* speed */
#airspeed{left:20px;bottom:130px;width:180px;padding:12px 16px}
#airspeed .lbl{color:#22d3ee;font-weight:700;letter-spacing:2px;font-size:10.5px;margin-bottom:4px;text-transform:uppercase}
#airspeed .val{font-size:42px;font-weight:800;line-height:1;color:#e6edf6;letter-spacing:-.5px}
#airspeed .sub{margin-top:8px;display:flex;justify-content:space-between;font-size:11px;color:#8ba3c0;font-weight:500}
#airspeed .bar{margin-top:8px;height:6px;background:#000;border-radius:3px;overflow:hidden;position:relative;border:1px solid #263652}
#airspeed .bar .fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,#22c55e,#fbbf24,#ef4444);transition:width .15s}
#airspeed .bar .mark{position:absolute;top:-2px;width:2px;height:10px;background:#e6edf6}

/* altitude */
#altitude{right:20px;bottom:130px;width:190px;padding:12px 16px;text-align:right}
#altitude .lbl{color:#22d3ee;font-weight:700;letter-spacing:2px;font-size:10.5px;margin-bottom:4px;text-transform:uppercase}
#altitude .val{font-size:42px;font-weight:800;line-height:1;color:#e6edf6;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
#altitude .sub{margin-top:8px;display:flex;justify-content:space-between;font-size:11px;color:#8ba3c0;direction:ltr}
#altitude .bar{margin-top:8px;height:6px;background:#000;border-radius:3px;overflow:hidden;position:relative;border:1px solid #263652}
#altitude .bar .fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,#22c55e,#22d3ee);transition:width .15s}

/* vsi */
#vsi{right:20px;bottom:20px;width:190px;padding:10px 16px;text-align:right}
#vsi .lbl{color:#22d3ee;font-weight:700;letter-spacing:2px;font-size:10.5px;margin-bottom:2px;text-transform:uppercase}
#vsi .val{font-size:28px;font-weight:700;line-height:1.1;color:#a5f3fc;font-variant-numeric:tabular-nums}
#vsi .sub{margin-top:3px;font-size:11px;color:#8ba3c0}

/* attitude & compass */
#attitude{left:50%;bottom:78px;transform:translateX(-50%);width:220px;height:220px;padding:0;border-radius:16px;overflow:hidden;background:#000;border:1px solid rgba(34,211,238,.45);box-shadow:0 6px 18px rgba(0,0,0,.35)}
#compass{left:50%;bottom:20px;transform:translateX(-50%);width:340px;height:54px;padding:0;overflow:hidden;border-radius:14px;border-color:rgba(34,211,238,.45)}
.lbl{font-size:10.5px;letter-spacing:1.5px;color:#22d3ee;font-weight:700;text-transform:uppercase}
.val{font-size:26px;font-weight:700;line-height:1.05}
.sub{font-size:11px;color:#8ba3c0}
#attitudeCanvas{display:block;width:220px;height:220px}
#compassCanvas{display:block;width:340px;height:54px}

/* chips */
#configPanel{position:absolute;left:50%;transform:translateX(-50%);bottom:310px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:85vw}
.cfgChip{
  padding:7px 14px;
  border-radius:9px;
  background:rgba(15,24,41,.7);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(100,130,170,.3);
  font-size:10.5px;
  letter-spacing:1px;
  color:#8ba3c0;
  white-space:nowrap;
  font-weight:700;
  text-transform:uppercase;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  transition:all .12s;
}
.cfgChip.on{background:#166534;color:#d1fae5;border-color:#22c55e}
.cfgChip.warn{background:#7c2d12;color:#fed7aa;border-color:#f97316}
.cfgChip.fire{background:#7f1d1d;color:#fecaca;border-color:#ef4444;animation:blink .5s infinite alternate}
.cfgChip.rev{background:#4c1d95;color:#e9d5ff;border-color:#a855f7}
.cfgChip.wx{background:#1e3a8a;color:#dbeafe;border-color:#3b82f6}
@keyframes blink{from{opacity:1}to{opacity:.6}}

/* warnings */
#stallWarn{
  position:absolute;left:50%;top:120px;transform:translateX(-50%);
  font-size:14px;font-weight:800;letter-spacing:2.5px;
  color:#fff;opacity:0;transition:opacity .15s;
  padding:10px 20px;border-radius:10px;
  background:#b91c1c;
  border:2px solid #000;
  box-shadow:0 3px 0 #000;
  text-transform:uppercase;
}
#stallWarn.on{opacity:1;animation:pulse .5s infinite alternate}
@keyframes pulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.04)}}

#windWarn{
  position:absolute;left:50%;top:168px;transform:translateX(-50%);
  font-size:12px;font-weight:700;letter-spacing:1.5px;
  color:#0b1220;opacity:0;transition:opacity .15s;
  padding:8px 16px;border-radius:10px;
  background:#fbbf24;
  border:2px solid #000;
  box-shadow:0 3px 0 #000;
  text-transform:uppercase;
}
#windWarn.on{opacity:.95}

body.cockpit #attitude,body.cockpit #compass,body.cockpit #configPanel,body.cockpit #stallWarn,body.cockpit #windWarn,body.cockpit #airspeed,body.cockpit #altitude,body.cockpit #vsi{opacity:0;transition:opacity .4s}
body.cockpit #msgBox{top:auto;bottom:84px}
body.cockpit #infoBox{opacity:.75}

/* ============ START OVERLAY ============ */
#overlay{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#0b1220 0%,#0f1b33 60%,#0a1428 100%);
  overflow:auto;padding:20px;
}
#overlay.hidden{display:none}

.card{
  position:relative;
  width:min(840px,94vw);
  background:#111a2e;
  border:2px solid #22d3ee;
  border-radius:14px;
  padding:30px 34px;
  box-shadow:0 4px 0 #000,0 20px 60px rgba(0,0,0,.6);
  color:#e6edf6;
}
.card h1{
  font-size:26px;letter-spacing:6px;
  color:#e6edf6;margin-bottom:4px;
  font-weight:800;text-transform:uppercase;
  text-align:center;
}
.card h1::after{content:'';display:block;width:60px;height:3px;background:#22d3ee;margin:10px auto 0;border-radius:2px}
.card h2{
  font-size:11px;letter-spacing:2.5px;
  color:#8ba3c0;font-weight:600;
  margin-bottom:24px;text-transform:uppercase;
  text-align:center;
}

.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.rowFull{grid-column:span 2}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;grid-column:span 2}

.card label{
  display:block;font-size:10.5px;letter-spacing:1.5px;
  color:#22d3ee;margin-bottom:6px;
  text-transform:uppercase;font-weight:700;
}
.card input,.card select{
  width:100%;padding:11px 13px;
  background:#0a0f1c;
  border:2px solid #263652;
  border-radius:8px;
  color:#e6edf6;
  font-family:inherit;
  font-size:13px;
  font-weight:500;
  outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.card input:focus,.card select:focus{
  border-color:#22d3ee;
  box-shadow:0 0 0 3px rgba(34,211,238,.2);
}
.card select{cursor:pointer}
.card select option{background:#0a0f1c;color:#e6edf6}

.hint{
  font-size:12px;color:#a5b8d0;line-height:1.6;
  margin-top:8px;grid-column:span 2;
  padding:12px 16px;
  background:#0a1424;
  border-radius:8px;
  border-left:3px solid #22d3ee;
}

.sectionHead{
  font-size:12px;letter-spacing:2px;
  color:#22d3ee;
  margin:18px 0 10px 0;padding-bottom:8px;
  border-bottom:2px solid #263652;
  text-transform:uppercase;
  grid-column:span 2;
  font-weight:700;
}

.keys{
  display:grid;grid-template-columns:auto 1fr auto 1fr;
  gap:6px 16px;font-size:11.5px;margin-top:16px;
  color:#a5b8d0;
  background:#0a1424;
  padding:14px;border-radius:10px;
  border:2px solid #263652;
}
.keys b{
  color:#e6edf6;font-weight:700;
  font-family:inherit;font-size:10.5px;
  padding:2px 8px;
  background:#1e2a44;
  border:1px solid #3a4a68;
  border-radius:5px;
  letter-spacing:.3px;
}

#startBtn{
  margin-top:20px;width:100%;padding:16px;
  border:2px solid #000;border-radius:10px;cursor:pointer;
  background:#22d3ee;
  color:#0b1220;
  font-family:inherit;
  font-size:14px;letter-spacing:3px;
  font-weight:800;text-transform:uppercase;
  box-shadow:0 4px 0 #000;
  transition:transform .08s,box-shadow .08s,filter .15s;
}
#startBtn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 5px 0 #000}
#startBtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #000}
#startBtn:disabled{opacity:.5;cursor:wait;filter:grayscale(.5)}
#loadStatus{margin-top:12px;font-size:12px;color:#22d3ee;min-height:18px;text-align:center;font-weight:600;letter-spacing:.5px}

/* ============ CRASH OVERLAY ============ */
#crashOverlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(60,0,0,.85)}
#crashOverlay.show{display:flex;animation:crashIn .2s ease-out}
@keyframes crashIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
#crashOverlay .card{
  background:#1a0d0d;
  border-color:#ef4444;
  width:min(420px,90vw);
  box-shadow:0 4px 0 #000,0 20px 60px rgba(0,0,0,.8),0 0 50px rgba(239,68,68,.2);
}
#crashOverlay h1{color:#ef4444}
#crashOverlay h1::after{background:#ef4444}
#respawnBtn{
  margin-top:18px;width:100%;padding:14px;
  border:2px solid #000;border-radius:10px;cursor:pointer;
  background:#ef4444;
  color:#fff;
  font-family:inherit;
  font-size:13px;letter-spacing:3px;
  font-weight:800;text-transform:uppercase;
  box-shadow:0 4px 0 #000;
  transition:transform .08s,box-shadow .08s,filter .15s;
}
#respawnBtn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 5px 0 #000}
#respawnBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #000}
#wxFlash{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0;background:#fff}

/* ============ FAULT PANEL ============ */
#faultPanel{
  position:fixed;top:52px;right:14px;z-index:9998;
  width:240px;padding:10px 12px;border-radius:12px;
  background:#1a0d0d;
  border:2px solid #ef4444;
  font-size:11.5px;display:none;line-height:1.6;
  box-shadow:0 3px 0 #000,0 10px 30px rgba(0,0,0,.6);
}
#faultPanel.show{display:block;animation:faultIn .2s ease-out}
@keyframes faultIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
#faultPanel .fh{
  color:#fca5a5;letter-spacing:1.5px;
  margin-bottom:6px;padding-bottom:6px;
  border-bottom:2px solid rgba(239,68,68,.4);
  font-weight:700;font-size:11px;
  text-transform:uppercase;
}
.faultRow{display:flex;justify-content:space-between;padding:3px 0;color:#fbbf24;font-weight:600}
.faultRow.sev3{color:#ef4444;animation:blink .5s infinite alternate;font-weight:700}
.faultRow.sev1{color:#fbbf24}
.faultRow .rst{color:#8ba3c0;font-size:10px;letter-spacing:1px;font-weight:500}

#masterWarn{position:absolute;left:50%;top:200px;transform:translateX(-50%);display:none;gap:12px;pointer-events:none}
#masterWarn.on{display:flex}
#masterWarn>div{
  padding:10px 20px;border-radius:10px;
  font-weight:800;letter-spacing:2.5px;font-size:13px;
  display:none;
  border:2px solid #000;
  box-shadow:0 3px 0 #000;
  text-transform:uppercase;
}
#masterWarn>div.show{display:block;animation:pulse .4s infinite alternate}
#masterWarn .mw{background:#b91c1c;color:#fff}
#masterWarn .mc{background:#d97706;color:#fff}

#faultTriggers{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
#faultToggleBtn{
  padding:10px 16px;border-radius:10px;
  background:#1a0d0d;
  border:2px solid #f97316;color:#fdba74;
  font-family:inherit;
  font-size:12px;font-weight:700;
  cursor:pointer;letter-spacing:1.2px;
  box-shadow:0 3px 0 #000;
  transition:transform .08s,box-shadow .08s,filter .15s;
}
#faultToggleBtn:hover{filter:brightness(1.15);transform:translateY(-1px);box-shadow:0 4px 0 #000}
#faultToggleBtn:active{transform:translateY(1px);box-shadow:0 2px 0 #000}

#faultButtons{
  max-height:72vh;overflow-y:auto;display:none;flex-direction:column;gap:5px;
  padding:12px;border-radius:12px;
  background:#0a0f1c;
  border:2px solid #22d3ee;
  min-width:210px;
  box-shadow:0 4px 0 #000,0 16px 40px rgba(0,0,0,.7);
}
#faultButtons.show{display:flex;animation:faultIn .18s ease-out}
.fgTitle{
  font-size:10px;letter-spacing:1.5px;
  color:#22d3ee;margin:3px 0 6px 2px;
  font-weight:700;text-transform:uppercase;
}
.fgSep{height:2px;background:#263652;border-radius:1px;margin:7px 0}
.faultBtn{
  padding:8px 12px;border-radius:7px;
  background:#111a2e;
  border:2px solid #263652;color:#a5b8d0;
  font-size:11.5px;font-family:inherit;font-weight:600;
  cursor:pointer;letter-spacing:.3px;text-align:left;
  transition:all .1s;
}
.faultBtn:hover{background:#1e2a44;border-color:#3a8dab;color:#e6edf6;transform:translateX(2px)}
.faultBtn.active{background:#7f1d1d;border-color:#ef4444;color:#fecaca}
.faultBtn.clear{background:#14532d;border-color:#22c55e;color:#bbf7d0}
.faultBtn.clear:hover{background:#166534;border-color:#4ade80}
.faultBtn.imgOn{background:#7c2d12;border-color:#f97316;color:#fed7aa}

#tcas{right:20px;bottom:262px;width:200px;height:200px;padding:10px}
#tcasCanvas{display:block;width:180px;height:180px;border-radius:8px}

/* ============ TOUCH UI ============ */
#touchUI{display:none;position:fixed;inset:0;z-index:30;pointer-events:none;user-select:none;-webkit-user-select:none;touch-action:none}
body.mobile #touchUI{display:block}
#touchUI>*{pointer-events:auto;touch-action:none}
#joy{
  position:absolute;left:20px;bottom:20px;width:140px;height:140px;border-radius:50%;
  background:rgba(10,20,36,.7);
  border:3px solid #22d3ee;
  box-shadow:0 4px 0 #000,inset 0 0 24px rgba(34,211,238,.1);
}
#joyK{
  position:absolute;left:49px;top:49px;width:42px;height:42px;border-radius:50%;
  background:#22d3ee;
  border:2px solid #000;
  box-shadow:0 3px 0 #000;
}
#thr{
  position:absolute;right:20px;bottom:20px;width:56px;height:180px;border-radius:12px;
  background:rgba(10,20,36,.7);
  border:3px solid #22d3ee;overflow:hidden;
  box-shadow:0 4px 0 #000;
}
#thrF{position:absolute;left:0;bottom:0;width:100%;height:0;background:linear-gradient(0deg,#22c55e,#fbbf24,#ef4444);opacity:.9}
#thrL{position:absolute;top:6px;left:0;width:100%;text-align:center;font-size:10px;color:#fff;letter-spacing:1.5px;font-weight:700}

.tb{
  position:absolute;min-width:52px;padding:10px 8px;
  border-radius:8px;text-align:center;
  font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.5px;
  color:#e6edf6;
  background:#111a2e;
  border:2px solid #263652;
  box-shadow:0 3px 0 #000;
  transition:all .08s;
}
.tb.dn{background:#22d3ee;color:#0b1220;border-color:#000;transform:translateY(2px);box-shadow:0 1px 0 #000}
#tbRow{position:absolute;left:170px;right:96px;bottom:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#tbRow .tb{position:static}
#tbYL{left:170px;bottom:100px}
#tbYR{left:230px;bottom:100px}

body.mobile #infoBox,body.mobile #configPanel,body.mobile #compass,body.mobile #vsi,body.mobile #bootBadge{display:none!important}
body.mobile #airspeed{left:8px!important;top:8px!important;bottom:auto!important;width:115px!important;padding:8px 10px!important}
body.mobile #altitude{right:8px!important;top:8px!important;bottom:auto!important;width:125px!important;padding:8px 10px!important}
body.mobile #airspeed .val,body.mobile #altitude .val{font-size:26px!important}
body.mobile #attitude{bottom:auto!important;top:8px!important;transform:translateX(-50%) scale(.5)!important;transform-origin:top center}
body.mobile #tcas{right:8px!important;bottom:auto!important;top:96px!important;transform:scale(.7);transform-origin:top right}
body.mobile #camBadge{top:auto;bottom:160px;opacity:.8;font-size:11px;padding:7px 14px}
body.mobile #msgBox{top:auto!important;bottom:200px!important;font-size:12px}
body.mobile #stallWarn,body.mobile #windWarn,body.mobile #masterWarn{top:104px!important}
body.mobile #faultTriggers{bottom:auto!important;top:160px;left:8px;right:auto;align-items:flex-start}
body.mobile #faultToggleBtn{padding:8px 10px;font-size:10px}
body.mobile #faultButtons{max-height:45vh}
body.mobile #faultPanel{top:auto;bottom:210px;right:8px}

#smokeHaze{position:fixed;inset:0;z-index:14;pointer-events:none;opacity:0;transition:opacity 2.5s;background:radial-gradient(ellipse at 50% 55%,rgba(90,90,92,.25),rgba(35,35,38,.8) 85%)}

/* ============ FMS ============ */
#fms{
